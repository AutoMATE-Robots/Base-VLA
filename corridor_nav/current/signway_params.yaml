# Parameters for signway_reasoner_node.py
#   python3 -u signway_reasoner_node.py --ros-args --params-file signway_params.yaml -p goal:="room 6-217"
#
# The VLM API key is NOT here on purpose. Put it in ~/.signway_secrets (chmod 600):
#   export GEMINI_API_KEY=...
signway_reasoner:
  ros__parameters:
    goal: ""                     # set on the command line, or publish /signway/goal later

    # --- adaptive gate ------------------------------------------------------------
    # PLACEHOLDERS until calibration exists (adaptive_reasoning/calib/w.json and tau).
    # 0.45 / 60 px are the values used for the submission replay videos
    # (render_submission.py --tau 0.45 --min-plate-h 60). Re-fit before reporting numbers.
    tau: 0.45                    # fire when q = R * legibility >= tau
    min_plate_h: 60.0            # px; below this a relevant sign is ACQUIRED, not read
    fast_path: true              # OCR read the goal line AND its arrow -> decide, no VLM call
    reason_hz: 2.0               # docTR + gate rate (each step OCRs a full frame)

    # --- VLM (OpenAI-compatible chat-completions endpoint) ---------------------------
    # Gemini via its OpenAI-compatible endpoint (key: GEMINI_API_KEY).
    # Any other OpenAI-compatible server works too (key: OPENAI_API_KEY), e.g. a vLLM
    # server running Qwen2.5-VL-7B-Instruct like the paper: vlm_base_url http://<host>:8000/v1
    vlm_model: "gemini-3.6-flash"
    vlm_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    vlm_reasoning: "low"         # "none" for servers that do not accept reasoning_effort
    vlm_timeout_s: 15.0
    vlm_max_retries: 1

    # --- maneuver: a trip is a chain of signs until one says ARRIVED --------------------
    turn_done_deg: 80.0          # net yaw from /odom after turn_left / turn_right
    straight_done_m: 3.0         # distance from /odom after a "straight" decision
    decision_timeout_s: 30.0     # fallback only when /odom is silent
    wait_for_opening: true       # hold a turn decision until the LiDAR sees that side open
    opening_scans: 3             # consecutive /lidar/openings_array scans (10 Hz) to confirm
    max_wait_m: 20.0             # release the turn anyway after driving this far without it

    # --- memory: same text = same sign only if read near here, facing the same way -------
    memory_radius_m: 8.0
    memory_yaw_tol_deg: 45.0

    # --- slow down while a relevant sign is being read, by the size of its text ---------
    # v_cap = (fy * letter_h / text_px - cap_buffer_m) / (measured VLM latency + cap_margin_s)
    speed_cap: true              # publishes /signway/speed_cap; v8_drive_node use_speed_cap
    camera_fy_px: 2060.0         # from signway_dataset/make_calib.py. VERIFY for this camera
    sign_letter_h_m: 0.05        # assumed letter height; bigger real letters -> slower (safe side)
    cap_margin_s: 1.0
    cap_buffer_m: 1.0            # answer must land before the robot is this close to the sign
    cap_min_speed: 0.15          # never cap below this (drive creep is 0.10)

    # --- topics / files ----------------------------------------------------------------
    image_topic: "/image_raw"
    odom_topic: "/odom"
    prompt_topic: "/vla/prompt"
    publish_prompts: true        # false = log the prompt it would send, publish nothing
    calib_path: ""               # "" = adaptive_reasoning/calib/w.json if present
    goals_dir: ""                # "" = adaptive_reasoning/goals
    log_dir: "~/signway_logs"    # events.jsonl, VLM ledger, exact payload crops per run
